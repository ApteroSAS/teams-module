<html>
<head>
  <title>Login Start Page</title>
  <meta charset="utf-8" />
</head>

<body>
<script
        src="https://res.cdn.office.net/teams-js/2.0.0/js/MicrosoftTeams.min.js"
        integrity="sha384-QtTBFeFlfRDZBfwHJHYQp7MdLJ2C3sfAEB1Qpy+YblvjavBye+q87TELpTnvlXw4"
        crossorigin="anonymous"
></script>
<script
        type="text/javascript"
        src="https://alcdn.msauth.net/browser/2.21.0/js/msal-browser.min.js"
        integrity="sha384-s/NxjjAgw1QgpDhOlVjTceLl4axrp5nqpUbCPOEQy1PqbFit9On6uw2XmEF1eq0s"
        crossorigin="anonymous"
></script>
<script type="text/javascript">
  microsoftTeams.app.initialize().then(() => {
    microsoftTeams.app.getContext().then(async (context) => {
      var currentURL = new URL(window.location);
      var clientId = currentURL.searchParams.get("clientId");
      var scope = currentURL.searchParams.get("scope");
      var loginHint = currentURL.searchParams.get("loginHint");

      //https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade
      var commonClientIds = [
        'c89c5d54-37ec-49d6-952a-befc9b770079',
        '8cb358b6-25aa-4afc-b403-3362db42ea49',
        'af2118e4-695b-4bf3-afdf-0c30a851f57c',
        'b292cf20-4b89-4d54-93e6-5da9cc164de5',
        'b5112d7a-84a8-499f-b9b9-fc687129a349'
      ]; // Add client IDs that should use common authority here
      var tenantClientIds = ['12ee7a90-4b99-4717-becc-9384ab5d09c3']; // Add client IDs that should use tenant-specific authority here

      var authority;

      if (commonClientIds.includes(clientId)) {
        authority = 'https://login.microsoftonline.com/common';
      } else if (tenantClientIds.includes(clientId)) {
        authority = `https://login.microsoftonline.com/${context.user.tenant.id}`;
      } else {
        alert("App not registered.");
        return;
      }

      const msalConfig = {
        auth: {
          clientId: clientId,
          authority: authority,
          navigateToLoginRequestUrl: false
        },
        cache: {
          cacheLocation: "sessionStorage",
        },
      }

      const msalInstance = new msal.PublicClientApplication(msalConfig);
      const scopesArray = scope.split(" ");
      const scopesRequest = {
        scopes: scopesArray,
        redirectUri: window.location.origin + `/auth-end.html?clientId=${clientId}`,
        loginHint: loginHint
      };
      await msalInstance.loginRedirect(scopesRequest);
    });
  });
</script>
</body>
</html>
